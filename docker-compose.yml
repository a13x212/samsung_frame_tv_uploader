version: "3.9"

services:
  frame-uploader:
    image: ghcr.io/a13x212/samsung-frame-tv-uploader:latest
    # network_mode: host is required for SSDP UDP multicast discovery on Linux.
    # App will be accessible at http://<host-ip>:3000
    network_mode: host
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TV_APP_NAME=Frame Uploader
      - TOKEN_STORE_PATH=/app/data/tv-tokens.json
      - SSDP_TIMEOUT_MS=4000
      - NETWORK_SCAN_TIMEOUT_MS=500
    volumes:
      - tv-tokens:/app/data
    restart: unless-stopped

volumes:
  tv-tokens:
