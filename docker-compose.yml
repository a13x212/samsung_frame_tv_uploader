version: "3.9"

services:
  frame-uploader:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TV_APP_NAME=Frame Uploader
      - TOKEN_STORE_PATH=/app/data/tv-tokens.json
      - SSDP_TIMEOUT_MS=4000
      - NETWORK_SCAN_TIMEOUT_MS=500
    volumes:
      - tv-tokens:/app/data
    restart: unless-stopped

volumes:
  tv-tokens:
